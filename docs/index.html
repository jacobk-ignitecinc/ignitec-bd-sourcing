<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ignitec BD Sourcing Cockpit</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --red:#C0222C; --navy:#1F3864; --ink:#1a1a1a; --muted:#5b6472;
    --line:#dfe3ea; --bg:#f4f6f9; --card:#fff;
    --warm:#1b7a43; --warmbg:#e6f4ec; --cold:#1F3864; --coldbg:#eef1fb;
    --amber:#946200; --amberbg:#fbf1dc; --grey:#5b6472; --greybg:#eceef2;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
  header.app{background:var(--card);border-bottom:3px solid var(--red);padding:16px 22px}
  h1{color:var(--red);font-size:22px;margin:0 0 4px}
  header.app .sub{color:var(--muted);font-size:12.5px}
  h2{color:var(--navy);font-size:15px;margin:0 0 8px}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);
       border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  .bar .grow{flex:1 1 auto}
  .src{font-size:12px;color:var(--muted)} .src b{color:var(--ink)}
  input,select,button,textarea{font-family:inherit;font-size:13px}
  input[type=text],input[type=date],input[type=number],select,textarea{
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink)}
  button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:bold}
  button.ghost{background:#fff;color:var(--navy)}
  button.warn{border-color:var(--red);background:#fff;color:var(--red)}
  a.btn{display:inline-block;text-decoration:none;border:1px solid var(--navy);background:#fff;color:var(--navy);
        border-radius:7px;padding:7px 12px;font-weight:bold;font-size:13px}
  button:hover,a.btn:hover{filter:brightness(1.06)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
  .tile .n{font-size:24px;font-weight:bold;color:var(--navy);line-height:1}
  .tile .l{font-size:11.5px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
  .tile.warm .n{color:var(--warm)} .tile.cold .n{color:var(--cold)} .tile.shape .n{color:var(--amber)}
  .filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
  .filters input[type=text]{min-width:220px}
  .count{font-size:12px;color:var(--muted);margin-left:auto}
  .lead{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .lead .head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
  .lead .head:hover{background:#fafbfc}
  .lead .headgrow{flex:1 1 auto;min-width:0}
  .lead .title{font-weight:bold;font-size:13.5px;overflow-wrap:anywhere}
  .lead .meta{color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--greybg);color:var(--grey);white-space:nowrap}
  .chip.src{background:#eef1fb;color:var(--navy)} .chip.lane{background:#e8f0ea;color:var(--warm)}
  .chip.held{background:var(--amberbg);color:var(--amber);font-weight:bold}
  .summary{margin-top:7px;font-size:12.5px;color:#2a2f36;background:#f6f8fb;border-left:3px solid var(--navy);
           border-radius:0 6px 6px 0;padding:6px 9px} .summary .angle{color:var(--muted)}
  .contacts{margin-top:6px;font-size:12px;color:#2a2f36;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .contacts .clabel{font-weight:bold;color:var(--navy)} .contacts .contact{white-space:nowrap}
  .contacts a,.ro .v a{color:var(--navy);text-decoration:none;border-bottom:1px dotted var(--navy)}
  .badge{font-size:11.5px;font-weight:bold;padding:4px 9px;border-radius:20px;white-space:nowrap;align-self:center}
  .b-warm{background:var(--warmbg);color:var(--warm)} .b-cold{background:var(--coldbg);color:var(--cold)}
  .panel{border-top:1px solid var(--line);padding:14px;display:none;background:#fcfdff}
  .lead.open .panel{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .fld label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%} .fld textarea{min-height:60px;resize:vertical}
  .ro{font-size:12.5px;margin-top:14px} .ro .row{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .ro .k{color:var(--muted);flex:0 0 120px} .ro .v{overflow-wrap:anywhere} .ro a{color:var(--navy)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
  .dirty{color:var(--red);font-weight:bold} .hint{font-size:11.5px;color:var(--muted)} .hidden{display:none!important}
</style>
</head>
<body>
<header class="app">
  <h1>Ignitec BD Sourcing Cockpit</h1>
  <div class="sub">Capability-aligned federal opportunities for two plays: subcontracting to recent-award primes, and getting ahead of expiring-contract recompetes.</div>
</header>

<div class="wrap">
  <div class="bar">
    <div class="grow">
      <div class="src" id="srcInfo">Loading leads...</div>
      <div class="hint" id="dirtyInfo"></div>
    </div>
    <label class="hint">Branch <input type="text" id="branchInput" style="width:220px;margin-left:6px" spellcheck="false"></label>
    <a class="btn" href="report.html" target="_blank" rel="noopener">Open report</a>
    <button class="ghost" id="reloadBtn">Reload from crawler</button>
    <button class="ghost" id="fileBtn">Load JSON file</button>
    <input type="file" id="fileInput" accept="application/json,.json" class="hidden">
    <button id="exportBtn">Export working set</button>
    <button class="warn" id="resetBtn" title="Clear local edits and accumulated leads">Reset local data</button>
  </div>

  <div class="tiles" id="tiles"></div>

  <h2>Pipeline</h2>
  <div class="filters">
    <input type="text" id="search" placeholder="Search prime, incumbent, agency, title...">
    <select id="fSource">
      <option value="">Both plays</option>
      <option value="Recent Award">Recent awards (sub)</option>
      <option value="Expiring Contract">Expiring (recompete)</option>
    </select>
    <select id="fRoute"><option value="">Any route</option><option>Warm</option><option>Cold</option></select>
    <select id="fLane"><option value="">All lanes</option></select>
    <select id="fAgency"><option value="">All agencies</option></select>
    <select id="fSort">
      <option value="default">Sort: play default</option>
      <option value="value">Value (high to low)</option>
      <option value="popEnd">Expiring soonest</option>
      <option value="dateAdded">Date added</option>
    </select>
    <label class="hint"><input type="checkbox" id="fShowUnaligned"> Show out-of-lane</label>
  </div>
  <div class="filters">
    <select id="fSetAside"><option value="">Set-aside: any</option><option value="has">Has a set-aside</option><option value="none">No set-aside</option></select>
    <label class="hint">Value $M
      <input type="number" id="fValMin" min="0" step="1" style="width:64px" placeholder="min">
      <input type="number" id="fValMax" min="0" step="1" style="width:64px" placeholder="max"></label>
    <select id="fExpiry">
      <option value="">Expiring: any</option>
      <option value="shaping">Shaping window (9-18mo)</option>
      <option value="180">Ends within 180d</option>
      <option value="365">Ends within 365d</option>
    </select>
    <label class="hint"><input type="checkbox" id="fHeldVeh"> Held-vehicle only</label>
    <input type="text" id="fExclude" placeholder="Exclude keywords (comma separated)">
    <button class="ghost" id="clearFilters" style="font-size:12px;padding:5px 10px">Clear filters</button>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
</div>

<script>
"use strict";
/* ------------------------------------------------------------ config */
const CONFIG = {
  owner: "jacobk-ignitecinc", repo: "ignitec-bd-sourcing",
  branch: "claude/contract-expiration-tracking-r1qpia",
  paths: ["output/all_leads.json", "output/latest_new_leads.json"],
  configPath: "config/ignitec.json",
  summariesPath: "output/summaries.json",
  enrichmentPath: "output/enrichment.json"
};
const LS_MASTER = "ignitec-bd-master-v2";
const LS_BRANCH = "ignitec-bd-branch";
const POSTURES = ["", "Warm - route via channel", "Cold outreach", "Shape", "Position", "Compete/Team"];
const STATUSES = ["Tracking","Reviewing","Contacted","In discussion","Pursuing","Submitted","Won","Lost","Parked"];
/* source-derived fields the crawler owns; everything else is user triage and preserved on reload */
const SOURCE_FIELDS = ["source","title","prime","agency","subAgency","value","awardId","solicitationNumber",
  "naics","psc","popStart","popEnd","setAside","vehicle","vehicleHeld","incumbent"];
const EDITABLE = ["posture","status","owner","nextAction","nextActionDate","notes","routing"];

let master = {}, dirty = false;
let LANES = [], AGENCY_TIERS = {}, WARM_PARTNERS = [], CORE_NAICS = new Set(), SUMMARIES = {}, ENRICHMENT = {};

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const esc = s => (s==null?"":String(s));
const today = () => new Date().toISOString().slice(0,10);
function fmtVal(v){const n=Number(v); if(!v||isNaN(n))return ""; if(n>=1e9)return "$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return "$"+(n/1e6).toFixed(1)+"M"; if(n>=1e3)return "$"+(n/1e3).toFixed(0)+"K"; return "$"+n;}
function daysUntil(d){if(!d)return null; const t=Date.parse(d); if(isNaN(t))return null; return Math.round((t-Date.now())/86400000);}
function rawURL(branch,path){return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${encodeURIComponent(branch)}/${path}`;}

/* ------------------------------------------------------------ capability logic (mirrors bd_report.py) */
function isWarm(name){const n=(name||"").toLowerCase(); return WARM_PARTNERS.some(p=>p&&n.includes(p));}
function route(l){return isWarm(l.prime||l.incumbent) ? "Warm" : "Cold";}
function laneMatch(l){
  const hay=((l.title||"")+" "+(l.notes||"")).toLowerCase();
  const naics=String(l.naics||""); let best=null;
  for(const lane of LANES){
    const kw=(lane.keywords||[]).some(k=>hay.includes(k));
    const nx=naics && (lane.naics||[]).includes(naics);
    if(kw||nx){ const t=lane.tier||3; if(!best||t<best.tier) best={tier:t,id:lane.id}; }
  }
  return best;
}
function pscInLane(psc){const c=String(psc||"").charAt(0).toUpperCase(); return c==="D"||c==="R"||c==="H";}
function aligned(l){ return !!laneMatch(l) || CORE_NAICS.has(String(l.naics||"")) || pscInLane(l.psc); }
function laneLabel(l){const m=laneMatch(l); if(m)return m.id+" (T"+m.tier+")";
  if(CORE_NAICS.has(String(l.naics||"")))return "NAICS "+l.naics; if(pscInLane(l.psc))return "PSC "+l.psc; return "-";}
function isShaping(l){const d=daysUntil(l.popEnd); return l.source==="Expiring Contract" && d!=null && d>=270 && d<=540;}

/* ------------------------------------------------------------ persistence */
function saveMaster(){try{localStorage.setItem(LS_MASTER,JSON.stringify(master));}catch(e){console.warn(e);}}
function loadMaster(){try{master=JSON.parse(localStorage.getItem(LS_MASTER)||"{}")||{};}catch(e){master={};}}
function setDirty(v){dirty=v; $("#dirtyInfo").innerHTML=v
  ? '<span class="dirty">Unsaved to file.</span> Edits are stored in this browser. Use Export working set to back up or share.' : '';}
function mergeLeads(arr){
  let added=0,seen=0;
  for(const raw of arr){
    if(!raw||!raw.id) continue;
    if(master[raw.id]){ seen++; const cur=master[raw.id];
      for(const k of SOURCE_FIELDS) if(raw[k]!==undefined) cur[k]=raw[k]; }
    else { master[raw.id]=raw; added++; }
  }
  saveMaster(); return {added,seen,total:arr.length};
}

/* ------------------------------------------------------------ data load */
async function loadConfig(branch){
  const cands=["../"+CONFIG.configPath, rawURL(branch,CONFIG.configPath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); const p=j.profile||{}; const c=j.crawl||{};
    LANES=p.lanes||[]; AGENCY_TIERS=p.agency_tiers||{};
    WARM_PARTNERS=(p.warm_partners||c.warm_partners||[]).map(x=>x.toLowerCase());
    CORE_NAICS=new Set(c.naics_codes||[]); return true; }catch(e){} }
  return false;
}
async function loadSummaries(branch){
  const cands=["../"+CONFIG.summariesPath, rawURL(branch,CONFIG.summariesPath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); if(j && typeof j==="object"){ SUMMARIES=j; return true; } }catch(e){} }
  return false;
}
async function loadEnrichment(branch){
  const cands=["../"+CONFIG.enrichmentPath, rawURL(branch,CONFIG.enrichmentPath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); if(j && typeof j==="object"){ ENRICHMENT=j; return true; } }catch(e){} }
  return false;
}
async function fetchLeads(branch){
  const cands=[]; for(const p of CONFIG.paths){ cands.push("../"+p); cands.push(rawURL(branch,p)); }
  let lastErr;
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"});
    if(!r.ok){lastErr=u+" -> HTTP "+r.status; continue;} const d=await r.json();
    if(Array.isArray(d)) return {data:d,url:u}; lastErr=u+" -> not an array"; }catch(e){lastErr=u+" -> "+e.message;} }
  throw new Error(lastErr||"no source reachable");
}
async function reload(){
  const branch=$("#branchInput").value.trim()||CONFIG.branch;
  localStorage.setItem(LS_BRANCH,branch);
  $("#srcInfo").textContent="Loading leads from "+branch+" ...";
  await loadConfig(branch);
  await loadSummaries(branch);
  await loadEnrichment(branch);
  try{
    const {data,url}=await fetchLeads(branch);
    const res=mergeLeads(data);
    const short=url.startsWith("..")?"repo (Pages)":"raw.githubusercontent.com";
    $("#srcInfo").innerHTML=`Loaded <b>${res.total}</b> from ${short} on <b>${esc(branch)}</b>. `+
      `Added ${res.added}, ${res.seen} already tracked. Working set: <b>${Object.keys(master).length}</b>. `+
      `Lanes loaded: ${LANES.length}.`;
    render();
  }catch(e){
    $("#srcInfo").innerHTML=`Could not auto-load (${esc(e.message)}). Use <b>Load JSON file</b> to import output/all_leads.json.`;
    render();
  }
}

/* ------------------------------------------------------------ export / edit */
function exportJSON(){
  const arr=Object.values(master);
  const blob=new Blob([JSON.stringify(arr,null,2)],{type:"application/json"});
  const a=el("a"); a.href=URL.createObjectURL(blob);
  a.download="ignitec_bd_working_set_"+today().replace(/-/g,"")+".json";
  document.body.appendChild(a); a.click(); a.remove(); setDirty(false);
}
function edit(id,field,value){const l=master[id]; if(!l)return; l[field]=value; l.lastTouched=today(); saveMaster(); setDirty(true);}

/* ------------------------------------------------------------ render */
function optionList(sel,values,current){sel.innerHTML="";
  for(const v of values){const o=el("option"); o.value=v; o.textContent=v===""?"(none)":v; if(v===current)o.selected=true; sel.appendChild(o);}}

function leadCard(l){
  const card=el("div","lead"); card.dataset.id=l.id;
  const head=el("div","head"); const grow=el("div","headgrow");
  const isAward=l.source==="Recent Award";
  const target=isAward?(l.prime||"prime"):(l.incumbent||l.prime||"incumbent");
  grow.appendChild(el("div","title", l.title||l.id));
  const bits=[]; if(l.agency)bits.push(l.agency); bits.push((isAward?"Prime: ":"Incumbent: ")+target);
  if(l.value)bits.push(fmtVal(l.value));
  grow.appendChild(el("div","meta", bits.join("  ·  ")));
  const chips=el("div","chips");
  chips.appendChild(el("span","chip src", isAward?"Recent Award":"Expiring Contract"));
  chips.appendChild(el("span","chip lane", laneLabel(l)));
  if(l.status)chips.appendChild(el("span","chip", l.status));
  if(l.owner)chips.appendChild(el("span","chip","Owner: "+l.owner));
  if(l.setAside)chips.appendChild(el("span","chip", String(l.setAside).slice(0,28)));
  if(l.vehicle)chips.appendChild(el("span","chip"+(l.vehicleHeld?" held":""), (l.vehicleHeld?"Vehicle HELD: ":"Vehicle: ")+l.vehicle));
  const du=daysUntil(l.popEnd);
  if(!isAward && du!=null && du>=0)chips.appendChild(el("span","chip",(isShaping(l)?"Shaping window · ":"")+"ends in "+du+"d"));
  grow.appendChild(chips);
  const sum=SUMMARIES[l.id];
  if(sum && sum.summary){
    const sd=el("div","summary"); sd.appendChild(document.createTextNode(sum.summary));
    if(sum.outreach_angle){ const a=el("span","angle"); a.textContent="  Angle: "+sum.outreach_angle; sd.appendChild(a); }
    grow.appendChild(sd);
  }
  const enr=ENRICHMENT[l.id];
  if(enr && (enr.contacts||[]).length){
    const cd=el("div","contacts");
    cd.appendChild(el("span","clabel","Contacts:"));
    (enr.contacts||[]).slice(0,3).forEach((c,i)=>{
      const span=el("span","contact");
      const nm=c.name||c.email||"contact";
      if(c.email){ const a=el("a",null,nm); a.href="mailto:"+c.email; a.addEventListener("click",e=>e.stopPropagation()); span.appendChild(a); }
      else span.appendChild(document.createTextNode(nm));
      if(c.phone)span.appendChild(document.createTextNode(" · "+c.phone));
      cd.appendChild(span);
    });
    grow.appendChild(cd);
  }
  const r=route(l); const badge=el("span","badge "+(r==="Warm"?"b-warm":"b-cold"), r==="Warm"?"Warm - route via channel":"Cold outreach");
  head.appendChild(grow); head.appendChild(badge);
  head.addEventListener("click",()=>card.classList.toggle("open"));
  card.appendChild(head);

  const panel=el("div","panel");
  const grid=el("div","grid");
  function field(label,key,kind,opts){
    const f=el("div","fld"); f.appendChild(el("label",null,label)); let inp;
    if(kind==="select"){inp=el("select"); optionList(inp,opts,l[key]||"");}
    else if(kind==="textarea"){inp=el("textarea"); inp.value=l[key]||"";}
    else if(kind==="date"){inp=el("input"); inp.type="date"; inp.value=(l[key]||"").slice(0,10);}
    else {inp=el("input"); inp.type="text"; inp.value=l[key]||"";}
    inp.addEventListener("change",()=>edit(l.id,key,inp.value)); f.appendChild(inp); return f;
  }
  grid.appendChild(field("Status","status","select",STATUSES));
  grid.appendChild(field("Owner","owner","text"));
  grid.appendChild(field("Posture","posture","select",POSTURES));
  grid.appendChild(field("Next action date","nextActionDate","date"));
  const na=field("Next action","nextAction","text"); na.style.gridColumn="1/-1"; grid.appendChild(na);
  const nt=field("Notes","notes","textarea"); nt.style.gridColumn="1/-1"; grid.appendChild(nt);
  panel.appendChild(grid);

  const ro=el("div","ro"); ro.appendChild(el("h2",null,"Opportunity detail"));
  const inc=(enr&&enr.incumbent)||null;
  const incDisp=inc?(inc.name+(inc.parent&&inc.parent.toLowerCase()!==(inc.name||"").toLowerCase()?" ("+inc.parent+")":"")
                     +(inc.uei?" · UEI "+inc.uei:"")+(inc.cage?" · CAGE "+inc.cage:"")):target;
  const vehDisp=(l.vehicle||(enr&&enr.vehicle)||"");
  const rows=[["Source",l.source],["Award ID",l.awardId],[isAward?"Prime":"Incumbent",incDisp],
    ["Agency",l.agency],["Sub-agency",l.subAgency],["Value",fmtVal(l.value)],["NAICS",l.naics],["PSC",l.psc],
    ["Set-aside",l.setAside],["Vehicle",vehDisp+(l.vehicleHeld?" (HELD by Ignitec)":"")],
    ["PoP start",l.popStart],["PoP end",l.popEnd],["Lane match",laneLabel(l)],
    ["Date added",l.dateAdded],["Lead id",l.id]];
  for(const [k,v] of rows){ if(v==null||v===""||v==="-")continue;
    const row=el("div","row"); row.appendChild(el("div","k",k)); row.appendChild(el("div","v",String(v))); ro.appendChild(row); }
  if(enr && (enr.contacts||[]).length){
    (enr.contacts||[]).forEach(c=>{
      const row=el("div","row"); row.appendChild(el("div","k",c.role||"Contact"));
      const v=el("div","v"); const nm=c.name||c.email||"contact";
      if(c.email){ const a=el("a",null,nm); a.href="mailto:"+c.email; v.appendChild(a);} else v.appendChild(document.createTextNode(nm));
      const extra=[c.title,c.email&&c.name?c.email:null,c.phone].filter(Boolean).join(" · ");
      if(extra)v.appendChild(document.createTextNode(" — "+extra));
      row.appendChild(v); ro.appendChild(row);
    });
  }
  if(enr && enr.hgPath){ const row=el("div","row"); row.appendChild(el("div","k","HigherGov record"));
    const v=el("div","v"); const a=el("a",null,"open in HigherGov"); a.href=enr.hgPath; a.target="_blank"; a.rel="noopener"; v.appendChild(a); row.appendChild(v); ro.appendChild(row); }
  if(!enr){ const row=el("div","row"); row.appendChild(el("div","k","Contacts"));
    row.appendChild(el("div","v","pending HigherGov enrichment")); ro.appendChild(row); }
  if(l.notes){const row=el("div","row"); row.appendChild(el("div","k","Crawler notes")); row.appendChild(el("div","v",l.notes)); ro.appendChild(row);}
  panel.appendChild(ro);
  card.appendChild(panel);
  return card;
}

function currentFilters(){return{
  q:$("#search").value.trim().toLowerCase(), source:$("#fSource").value, route:$("#fRoute").value,
  lane:$("#fLane").value, agency:$("#fAgency").value, sort:$("#fSort").value,
  showUnaligned:$("#fShowUnaligned").checked, setAside:$("#fSetAside").value,
  valMin:parseFloat($("#fValMin").value), valMax:parseFloat($("#fValMax").value),
  expiry:$("#fExpiry").value, heldVeh:$("#fHeldVeh").checked, exclude:$("#fExclude").value.trim().toLowerCase()
};}
function matches(l,f){
  if(l.source!=="Recent Award" && l.source!=="Expiring Contract") return false;   // RFI feed paused
  if(!f.showUnaligned && !aligned(l)) return false;
  if(f.source && l.source!==f.source) return false;
  if(f.route && route(l)!==f.route) return false;
  if(f.lane){ const m=laneMatch(l); if(!m||m.id!==f.lane) return false; }
  if(f.agency && l.agency!==f.agency) return false;
  if(f.heldVeh && !l.vehicleHeld) return false;
  if(f.setAside==="has" && !l.setAside) return false;
  if(f.setAside==="none" && l.setAside) return false;
  const v=Number(l.value)||0;
  if(!isNaN(f.valMin) && v<f.valMin*1e6) return false;
  if(!isNaN(f.valMax) && f.valMax>0 && v>f.valMax*1e6) return false;
  if(f.expiry){ const d=daysUntil(l.popEnd);
    if(f.expiry==="shaping"){ if(!isShaping(l)) return false; }
    else { if(l.source!=="Expiring Contract"||d===null||d<0||d>Number(f.expiry)) return false; } }
  if(f.q){ const hay=(l.title+" "+l.agency+" "+l.prime+" "+l.incumbent+" "+l.awardId+" "+l.notes).toLowerCase();
    if(!hay.includes(f.q)) return false; }
  if(f.exclude){ const terms=f.exclude.split(",").map(t=>t.trim()).filter(Boolean);
    const hay=(l.title+" "+l.agency+" "+l.prime+" "+l.incumbent+" "+l.notes).toLowerCase();
    if(terms.some(t=>hay.includes(t))) return false; }
  return true;
}
function sortLeads(arr,key){
  if(key==="value") return arr.sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0));
  if(key==="popEnd") return arr.sort((a,b)=>(daysUntil(a.popEnd)??1e9)-(daysUntil(b.popEnd)??1e9));
  if(key==="dateAdded") return arr.sort((a,b)=>String(b.dateAdded).localeCompare(String(a.dateAdded)));
  // default: warm first, then expiring-shaping, then value
  return arr.sort((a,b)=>{
    const w=(isWarm(b.prime||b.incumbent)?1:0)-(isWarm(a.prime||a.incumbent)?1:0); if(w)return w;
    const s=(isShaping(b)?1:0)-(isShaping(a)?1:0); if(s)return s;
    return (Number(b.value)||0)-(Number(a.value)||0);
  });
}

function renderTiles(){
  const all=Object.values(master).filter(l=>l.source==="Recent Award"||l.source==="Expiring Contract");
  const al=all.filter(aligned);
  const awards=al.filter(l=>l.source==="Recent Award").length;
  const exp=al.filter(l=>l.source==="Expiring Contract").length;
  const warm=al.filter(l=>route(l)==="Warm").length;
  const cold=al.filter(l=>route(l)==="Cold").length;
  const shaping=al.filter(isShaping).length;
  const held=al.filter(l=>l.vehicleHeld).length;
  const outlane=all.length-al.length;
  const t=[["",al.length,"Aligned leads"],["",awards,"Recent awards"],["",exp,"Expiring"],
    ["warm",warm,"Warm (route via channel)"],["cold",cold,"Cold outreach"],
    ["shape",shaping,"Shaping window"],["",held,"Held-vehicle"],["",outlane,"Out-of-lane (hidden)"]];
  const box=$("#tiles"); box.innerHTML="";
  for(const [cls,n,l] of t){const d=el("div","tile "+cls); d.appendChild(el("div","n",String(n))); d.appendChild(el("div","l",l)); box.appendChild(d);}
}
function refreshFilterOptions(){
  const all=Object.values(master);
  const agencies=[...new Set(all.map(l=>l.agency).filter(Boolean))].sort();
  const keepA=$("#fAgency").value, keepL=$("#fLane").value;
  $("#fAgency").innerHTML='<option value="">All agencies</option>'+agencies.map(s=>`<option>${esc(s)}</option>`).join("");
  $("#fLane").innerHTML='<option value="">All lanes</option>'+LANES.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} - ${esc(x.title)}</option>`).join("");
  $("#fAgency").value=keepA; $("#fLane").value=keepL;
}
function render(){
  renderTiles(); refreshFilterOptions();
  const f=currentFilters();
  let arr=Object.values(master).filter(l=>matches(l,f));
  arr=sortLeads(arr,f.sort);
  const list=$("#list"); list.innerHTML="";
  const trackable=Object.values(master).filter(l=>l.source==="Recent Award"||l.source==="Expiring Contract").length;
  if(trackable===0){ list.appendChild(el("div","empty","No leads loaded yet. Use Reload from crawler or Load JSON file.")); }
  else if(arr.length===0){ list.appendChild(el("div","empty","No leads match the current filters.")); }
  else { const frag=document.createDocumentFragment(); for(const l of arr) frag.appendChild(leadCard(l)); list.appendChild(frag); }
  $("#count").textContent=arr.length+" shown";
}

/* ------------------------------------------------------------ wire up */
function init(){
  loadMaster();
  $("#branchInput").value=localStorage.getItem(LS_BRANCH)||CONFIG.branch;
  setDirty(false);
  $("#reloadBtn").addEventListener("click",reload);
  $("#exportBtn").addEventListener("click",exportJSON);
  $("#fileBtn").addEventListener("click",()=>$("#fileInput").click());
  $("#fileInput").addEventListener("change",ev=>{const file=ev.target.files[0]; if(!file)return;
    const rd=new FileReader(); rd.onload=()=>{try{const data=JSON.parse(rd.result);
      const res=mergeLeads(Array.isArray(data)?data:[data]);
      $("#srcInfo").innerHTML=`Imported <b>${res.total}</b> from file. Working set: <b>${Object.keys(master).length}</b>.`; render();
    }catch(e){alert("Could not parse JSON: "+e.message);}}; rd.readAsText(file); ev.target.value="";});
  $("#resetBtn").addEventListener("click",()=>{if(confirm("Clear all locally accumulated leads and edits? Export first if you want a backup.")){
    master={}; saveMaster(); setDirty(false); render(); $("#srcInfo").textContent="Local data cleared. Use Reload from crawler.";}});
  $("#clearFilters").addEventListener("click",()=>{
    ["#search","#fExclude","#fValMin","#fValMax"].forEach(s=>$(s).value="");
    ["#fSource","#fRoute","#fLane","#fAgency","#fSetAside","#fExpiry"].forEach(s=>$(s).value="");
    $("#fSort").value="default"; $("#fShowUnaligned").checked=false; $("#fHeldVeh").checked=false; render();});
  ["#search","#fSource","#fRoute","#fLane","#fAgency","#fSort","#fShowUnaligned",
   "#fSetAside","#fValMin","#fValMax","#fExpiry","#fHeldVeh","#fExclude"].forEach(sel=>{
    const e=$(sel); const ev=(e.tagName==="INPUT"&&(e.type==="text"||e.type==="number"))?"input":"change";
    e.addEventListener(ev,render);});
  window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault(); e.returnValue="";}});
  if(Object.keys(master).length>0) render();
  reload();
}
document.addEventListener("DOMContentLoaded",init);
</script>
