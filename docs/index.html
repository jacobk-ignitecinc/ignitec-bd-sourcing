<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ignitec BD Sourcing Cockpit</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --red:#C0222C; --navy:#1F3864; --ink:#1a1a1a; --muted:#5b6472;
    --line:#dfe3ea; --bg:#f4f6f9; --card:#fff;
    --warm:#1b7a43; --warmbg:#e6f4ec; --cold:#1F3864; --coldbg:#eef1fb;
    --amber:#946200; --amberbg:#fbf1dc; --grey:#5b6472; --greybg:#eceef2;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
  header.app{background:var(--card);border-bottom:3px solid var(--red);padding:16px 22px}
  h1{color:var(--red);font-size:22px;margin:0 0 4px}
  header.app .sub{color:var(--muted);font-size:12.5px}
  h2{color:var(--navy);font-size:15px;margin:0 0 8px}
  .wrap{max-width:1280px;margin:0 auto;padding:18px 22px 60px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);
       border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  .bar .grow{flex:1 1 auto}
  .src{font-size:12px;color:var(--muted)} .src b{color:var(--ink)}
  input,select,button,textarea{font-family:inherit;font-size:13px}
  input[type=text],input[type=date],input[type=number],select,textarea{
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink)}
  button{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:bold}
  button.ghost{background:#fff;color:var(--navy)}
  button.warn{border-color:var(--red);background:#fff;color:var(--red)}
  a.btn{display:inline-block;text-decoration:none;border:1px solid var(--navy);background:#fff;color:var(--navy);
        border-radius:7px;padding:7px 12px;font-weight:bold;font-size:13px}
  button:hover,a.btn:hover{filter:brightness(1.06)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
  .tile .n{font-size:24px;font-weight:bold;color:var(--navy);line-height:1}
  .tile .l{font-size:11.5px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
  .tile.warm .n{color:var(--warm)} .tile.cold .n{color:var(--cold)} .tile.shape .n{color:var(--amber)}
  .filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}
  .filters input[type=text]{min-width:220px}
  .count{font-size:12px;color:var(--muted);margin-left:auto}
  .lead{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .lead .head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer}
  .lead .head:hover{background:#fafbfc}
  .lead .headgrow{flex:1 1 auto;min-width:0}
  .lead .title{font-weight:bold;font-size:13.5px;overflow-wrap:anywhere}
  .lead .meta{color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--greybg);color:var(--grey);white-space:nowrap}
  .chip.src{background:#eef1fb;color:var(--navy)} .chip.lane{background:#e8f0ea;color:var(--warm)}
  .chip.held{background:var(--amberbg);color:var(--amber);font-weight:bold}
  .summary{margin-top:7px;font-size:12.5px;color:#2a2f36;background:#f6f8fb;border-left:3px solid var(--navy);
           border-radius:0 6px 6px 0;padding:6px 9px} .summary .angle{color:var(--muted)}
  .contacts{margin-top:6px;font-size:12px;color:#2a2f36;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
  .contacts .clabel{font-weight:bold;color:var(--navy)} .contacts .contact{white-space:nowrap}
  .contacts a,.ro .v a{color:var(--navy);text-decoration:none;border-bottom:1px dotted var(--navy)}
  .badge{font-size:11.5px;font-weight:bold;padding:4px 9px;border-radius:20px;white-space:nowrap;align-self:center}
  .b-warm{background:var(--warmbg);color:var(--warm)} .b-cold{background:var(--coldbg);color:var(--cold)}
  .panel{border-top:1px solid var(--line);padding:14px;display:none;background:#fcfdff}
  .lead.open .panel{display:block}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .fld label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%} .fld textarea{min-height:60px;resize:vertical}
  .ro{font-size:12.5px;margin-top:14px} .ro .row{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
  .ro .k{color:var(--muted);flex:0 0 120px} .ro .v{overflow-wrap:anywhere} .ro a{color:var(--navy)}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:40px;text-align:center;color:var(--muted)}
  .dirty{color:var(--red);font-weight:bold} .hint{font-size:11.5px;color:var(--muted)} .hidden{display:none!important}
  /* tabs */
  .tabs{display:flex;gap:4px;padding:0 22px;background:var(--card);border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);
    border-radius:0;padding:12px 16px;font-weight:bold;font-size:13.5px}
  .tabs button.active{color:var(--red);border-bottom-color:var(--red)}
  .tabs .pcount{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:20px;
    background:var(--greybg);color:var(--grey);font-size:11px}
  .tabs button.active .pcount{background:var(--warmbg);color:var(--warm)}
  /* pursue button on sourcing cards */
  .pursueBtn{align-self:center;border:1px solid var(--warm);background:#fff;color:var(--warm);
    border-radius:20px;padding:5px 11px;font-size:12px;white-space:nowrap}
  .pursueBtn.on{background:var(--warm);color:#fff}
  .chip.pipe{background:var(--warmbg);color:var(--warm);font-weight:bold}
  /* pipeline toolbar */
  .ptool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:14px}
  .ptool .gstatus{font-size:12px;color:var(--muted)} .ptool .gstatus.ok{color:var(--warm)} .ptool .gstatus.err{color:var(--red)}
  /* kanban board */
  .board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .col{flex:0 0 250px;background:#eef1f5;border-radius:10px;padding:8px;min-height:120px}
  .col.terminal{background:#e9ecf1}
  .col h3{font-size:12px;color:var(--navy);margin:2px 4px 8px;display:flex;justify-content:space-between;align-items:baseline;text-transform:uppercase;letter-spacing:.3px}
  .col h3 .csum{font-size:11px;color:var(--muted);font-weight:normal}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
  .pcard:hover{border-color:var(--navy)}
  .pcard .pt{font-weight:bold;font-size:12.5px;overflow-wrap:anywhere;margin-bottom:3px}
  .pcard .pm{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
  .pcard .prow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
  .pcard .mini{font-size:10.5px;padding:1px 7px;border-radius:20px;background:var(--greybg);color:var(--grey);white-space:nowrap}
  .pcard .mini.warm{background:var(--warmbg);color:var(--warm)} .pcard .mini.cold{background:var(--coldbg);color:var(--cold)}
  .pcard .mini.due{background:#fde9e9;color:var(--red)} .pcard .mini.ok{background:var(--warmbg);color:var(--warm)}
  .pcard .nav{display:flex;justify-content:space-between;margin-top:7px;gap:6px}
  .pcard .nav button{padding:2px 8px;font-size:11px;background:#fff;color:var(--navy);border:1px solid var(--line)}
  .pcard .nav button:disabled{opacity:.3;cursor:default}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;justify-content:center;align-items:flex-start;
    padding:36px 16px;z-index:50;overflow-y:auto}
  .modal .sheet{background:#fff;border-radius:12px;max-width:720px;width:100%;box-shadow:0 20px 50px rgba(16,24,40,.3)}
  .modal .mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .modal .mhead .x{border:none;background:none;color:var(--muted);font-size:20px;padding:0 4px;cursor:pointer}
  .modal .mbody{padding:16px 18px}
  .tl{margin-top:6px;border-left:2px solid var(--line);padding-left:12px}
  .tl .ev{position:relative;padding:5px 0;font-size:12.5px}
  .tl .ev::before{content:"";position:absolute;left:-17px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--navy)}
  .tl .ev .d{color:var(--muted);font-size:11px} .tl .ev .ty{font-weight:bold;color:var(--navy)}
  .addact{display:grid;grid-template-columns:150px 130px 1fr auto;gap:8px;align-items:end;margin-top:10px}
  @media(max-width:620px){.addact{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="app">
  <h1>Ignitec BD Sourcing Cockpit</h1>
  <div class="sub">Capability-aligned federal opportunities for two plays: subcontracting to recent-award primes, and getting ahead of expiring-contract recompetes.</div>
</header>

<div class="tabs">
  <button id="tabSourcing" class="active">Sourcing</button>
  <button id="tabPipeline">Pipeline <span class="pcount" id="pipeCount">0</span></button>
</div>

<div class="wrap">
  <div class="bar">
    <div class="grow">
      <div class="src" id="srcInfo">Loading leads...</div>
      <div class="hint" id="dirtyInfo"></div>
    </div>
    <label class="hint">Branch <input type="text" id="branchInput" style="width:220px;margin-left:6px" spellcheck="false"></label>
    <a class="btn" href="report.html" target="_blank" rel="noopener">Open report</a>
    <button class="ghost" id="reloadBtn">Reload from crawler</button>
    <button class="ghost" id="fileBtn">Load JSON file</button>
    <input type="file" id="fileInput" accept="application/json,.json" class="hidden">
    <button id="exportBtn">Export working set</button>
    <button class="warn" id="resetBtn" title="Clear local edits and accumulated leads">Reset local data</button>
  </div>

  <div id="sourcingView">
  <div class="tiles" id="tiles"></div>

  <h2>Triage queue</h2>
  <div class="filters">
    <input type="text" id="search" placeholder="Search prime, incumbent, agency, title...">
    <select id="fSource">
      <option value="">Both plays</option>
      <option value="Recent Award">Recent awards (sub)</option>
      <option value="Expiring Contract">Expiring (recompete)</option>
    </select>
    <select id="fRoute"><option value="">Any route</option><option>Warm</option><option>Cold</option></select>
    <select id="fLane"><option value="">All lanes</option></select>
    <select id="fAgency"><option value="">All agencies</option></select>
    <select id="fSort">
      <option value="default">Sort: play default</option>
      <option value="value">Value (high to low)</option>
      <option value="popEnd">Expiring soonest</option>
      <option value="dateAdded">Date added</option>
    </select>
    <label class="hint"><input type="checkbox" id="fShowUnaligned"> Show out-of-lane</label>
  </div>
  <div class="filters">
    <select id="fSetAside"><option value="">Set-aside: any</option><option value="has">Has a set-aside</option><option value="none">No set-aside</option></select>
    <label class="hint">Value $M
      <input type="number" id="fValMin" min="0" step="1" style="width:64px" placeholder="min">
      <input type="number" id="fValMax" min="0" step="1" style="width:64px" placeholder="max"></label>
    <select id="fExpiry">
      <option value="">Expiring: any</option>
      <option value="shaping">Shaping window (9-18mo)</option>
      <option value="180">Ends within 180d</option>
      <option value="365">Ends within 365d</option>
    </select>
    <label class="hint"><input type="checkbox" id="fHeldVeh"> Held-vehicle only</label>
    <input type="text" id="fExclude" placeholder="Exclude keywords (comma separated)">
    <button class="ghost" id="clearFilters" style="font-size:12px;padding:5px 10px">Clear filters</button>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>
  </div><!-- /sourcingView -->

  <div id="pipelineView" class="hidden">
    <div class="tiles" id="pTiles"></div>
    <div class="ptool">
      <div class="grow" style="flex:1 1 auto">
        <b style="color:var(--navy)">Shared pipeline</b>
        <span class="hint" id="pipeSrc"> &mdash; loads from output/pipeline.json on the branch.</span>
        <div class="gstatus" id="gStatus"></div>
      </div>
      <select id="pStageFilter"><option value="">All stages</option></select>
      <select id="pOwnerFilter"><option value="">All owners</option></select>
      <button class="ghost" id="pConnectBtn" title="Store a GitHub token in this browser to save the shared pipeline">Connect GitHub</button>
      <button class="ghost" id="pHelpBtn" title="How to create the token" style="padding:7px 10px">?</button>
      <button id="pSaveBtn" title="Commit the pipeline to output/pipeline.json">Save to GitHub</button>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
"use strict";
/* ------------------------------------------------------------ config */
const CONFIG = {
  owner: "jacobk-ignitecinc", repo: "ignitec-bd-sourcing",
  branch: "claude/contract-expiration-tracking-r1qpia",
  paths: ["output/all_leads.json", "output/latest_new_leads.json"],
  configPath: "config/ignitec.json",
  summariesPath: "output/summaries.json",
  enrichmentPath: "output/enrichment.json",
  pipelinePath: "output/pipeline.json"
};
/* Kanban stages (order = left to right). Won/Lost/Parked are terminal. */
const STAGES = ["Pursue","Researching","First contact","In discussion","Teaming/RFI","Submitted","Won","Lost","Parked"];
const TERMINAL = new Set(["Won","Lost","Parked"]);
const ACTIVITY_TYPES = ["Decided to pursue","Research","Call","Email","Meeting","RFI response",
  "Quote / proposal","Teaming","Stage change","Note","Won","Lost"];
const LS_PIPELINE = "ignitec-bd-pipeline-v1";
const LS_TOKEN = "ignitec-bd-gh-token";
const LS_MASTER = "ignitec-bd-master-v2";
const LS_BRANCH = "ignitec-bd-branch";
const POSTURES = ["", "Warm - route via channel", "Cold outreach", "Shape", "Position", "Compete/Team"];
const STATUSES = ["Tracking","Reviewing","Contacted","In discussion","Pursuing","Submitted","Won","Lost","Parked"];
/* source-derived fields the crawler owns; everything else is user triage and preserved on reload */
const SOURCE_FIELDS = ["source","title","prime","agency","subAgency","value","awardId","solicitationNumber",
  "naics","psc","popStart","popEnd","setAside","vehicle","vehicleHeld","incumbent","url"];
const EDITABLE = ["posture","status","owner","nextAction","nextActionDate","notes","routing"];

let master = {}, dirty = false;
let LANES = [], AGENCY_TIERS = {}, WARM_PARTNERS = [], CORE_NAICS = new Set(), SUMMARIES = {}, ENRICHMENT = {};
let PIPELINE = {};   // leadId -> pursuit record {stage, owner, nextAction, nextActionDate, notes, pursuedDate, stageSince, activities[], lastTouched}

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const esc = s => (s==null?"":String(s));
const today = () => new Date().toISOString().slice(0,10);
function fmtVal(v){const n=Number(v); if(!v||isNaN(n))return ""; if(n>=1e9)return "$"+(n/1e9).toFixed(2)+"B";
  if(n>=1e6)return "$"+(n/1e6).toFixed(1)+"M"; if(n>=1e3)return "$"+(n/1e3).toFixed(0)+"K"; return "$"+n;}
function daysUntil(d){if(!d)return null; const t=Date.parse(d); if(isNaN(t))return null; return Math.round((t-Date.now())/86400000);}
function rawURL(branch,path){return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/${encodeURIComponent(branch)}/${path}`;}

/* ------------------------------------------------------------ capability logic (mirrors bd_report.py) */
function isWarm(name){const n=(name||"").toLowerCase(); return WARM_PARTNERS.some(p=>p&&n.includes(p));}
function route(l){return isWarm(l.prime||l.incumbent) ? "Warm" : "Cold";}
function laneMatch(l){
  const hay=((l.title||"")+" "+(l.notes||"")).toLowerCase();
  const naics=String(l.naics||""); let best=null;
  for(const lane of LANES){
    const kw=(lane.keywords||[]).some(k=>hay.includes(k));
    const nx=naics && (lane.naics||[]).includes(naics);
    if(kw||nx){ const t=lane.tier||3; if(!best||t<best.tier) best={tier:t,id:lane.id}; }
  }
  return best;
}
function pscInLane(psc){const c=String(psc||"").charAt(0).toUpperCase(); return c==="D"||c==="R"||c==="H";}
function aligned(l){ return !!laneMatch(l) || CORE_NAICS.has(String(l.naics||"")) || pscInLane(l.psc); }
function laneLabel(l){const m=laneMatch(l); if(m)return m.id+" (T"+m.tier+")";
  if(CORE_NAICS.has(String(l.naics||"")))return "NAICS "+l.naics; if(pscInLane(l.psc))return "PSC "+l.psc; return "-";}
function isShaping(l){const d=daysUntil(l.popEnd); return l.source==="Expiring Contract" && d!=null && d>=270 && d<=540;}

/* ------------------------------------------------------------ persistence */
function saveMaster(){try{localStorage.setItem(LS_MASTER,JSON.stringify(master));}catch(e){console.warn(e);}}
function loadMaster(){try{master=JSON.parse(localStorage.getItem(LS_MASTER)||"{}")||{};}catch(e){master={};}}
function setDirty(v){dirty=v; $("#dirtyInfo").innerHTML=v
  ? '<span class="dirty">Unsaved to file.</span> Edits are stored in this browser. Use Export working set to back up or share.' : '';}
function mergeLeads(arr){
  let added=0,seen=0;
  for(const raw of arr){
    if(!raw||!raw.id) continue;
    if(master[raw.id]){ seen++; const cur=master[raw.id];
      for(const k of SOURCE_FIELDS) if(raw[k]!==undefined) cur[k]=raw[k]; }
    else { master[raw.id]=raw; added++; }
  }
  saveMaster(); return {added,seen,total:arr.length};
}

/* ------------------------------------------------------------ pipeline state */
function nowISO(){return new Date().toISOString();}
function loadPipelineLocal(){try{PIPELINE=JSON.parse(localStorage.getItem(LS_PIPELINE)||"{}")||{};}catch(e){PIPELINE={};}}
function savePipelineLocal(){try{localStorage.setItem(LS_PIPELINE,JSON.stringify(PIPELINE));}catch(e){console.warn(e);}}
/* Merge two pipeline maps: for each lead id, keep the record with the newer lastTouched. */
function mergePipeline(base, incoming){
  const out={...base};
  for(const id in incoming){
    const a=out[id], b=incoming[id];
    if(!a || String(b.lastTouched||"") > String(a.lastTouched||"")) out[id]=b;
  }
  return out;
}
async function loadPipelineRemote(branch){
  const cands=["../"+CONFIG.pipelinePath, rawURL(branch,CONFIG.pipelinePath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); if(j && typeof j==="object"){ PIPELINE=mergePipeline(PIPELINE,j); savePipelineLocal(); return true; } }catch(e){} }
  return false;
}
function isPursued(id){return !!PIPELINE[id];}
function touchPipe(id){ if(PIPELINE[id]) PIPELINE[id].lastTouched=nowISO(); savePipelineLocal(); }
function togglePursue(id){
  const l=master[id]; if(!l)return;
  if(PIPELINE[id]){
    if(!confirm("Remove this opportunity from the pipeline? Its activity log will be discarded on next save.")) return;
    delete PIPELINE[id];
  } else {
    PIPELINE[id]={ stage:"Pursue", owner:"", nextAction:"", nextActionDate:"", notes:"",
      pursuedDate:today(), stageSince:today(),
      activities:[{type:"Decided to pursue", date:today(), note:""}], lastTouched:nowISO() };
  }
  savePipelineLocal(); markPipeDirty();
  render(); renderPipeline();
}
function pipeEdit(id,field,value){ const p=PIPELINE[id]; if(!p)return; p[field]=value; touchPipe(id); markPipeDirty(); }
function setStage(id,stage,logNote){
  const p=PIPELINE[id]; if(!p||p.stage===stage)return;
  p.stage=stage; p.stageSince=today();
  p.activities=p.activities||[]; p.activities.push({type:"Stage change",date:today(),note:(logNote||("Moved to "+stage))});
  touchPipe(id); markPipeDirty(); renderPipeline();
}
function addActivity(id,type,date,note){
  const p=PIPELINE[id]; if(!p)return;
  p.activities=p.activities||[]; p.activities.push({type,date:date||today(),note:note||""});
  touchPipe(id); markPipeDirty();
}
function markPipeDirty(){ const el=$("#gStatus"); if(el){el.textContent="Unsaved pipeline changes in this browser. Save to GitHub to share."; el.className="gstatus";} updatePipeCount(); }
function updatePipeCount(){ const n=Object.keys(PIPELINE).length; const c=$("#pipeCount"); if(c)c.textContent=n; }

/* ------------------------------------------------------------ github save */
function ghToken(){return localStorage.getItem(LS_TOKEN)||"";}
function connectGitHub(){
  const cur=ghToken();
  const t=prompt("Paste a GitHub fine-grained personal access token with Contents: Read and write on "+
    CONFIG.owner+"/"+CONFIG.repo+".\n\nStored only in this browser (localStorage), never committed. Leave blank to disconnect.", cur);
  if(t===null)return;
  if(t.trim()) localStorage.setItem(LS_TOKEN,t.trim()); else localStorage.removeItem(LS_TOKEN);
  setGStatus(t.trim()?"GitHub connected. You can Save to GitHub.":"GitHub disconnected.", t.trim()?"ok":"");
}
function setGStatus(msg,cls){const el=$("#gStatus"); if(el){el.textContent=msg; el.className="gstatus "+(cls||"");}}
function showTokenHelp(){
  const root=$("#modalRoot"); root.innerHTML="";

function b64encode(str){return btoa(unescape(encodeURIComponent(str)));}
function b64decode(str){try{return decodeURIComponent(escape(atob(str)));}catch(e){return atob(str);}}
async function saveToGitHub(){
  const token=ghToken();
  if(!token){ connectGitHub(); if(!ghToken())return; }
  const branch=$("#branchInput").value.trim()||CONFIG.branch;
  const api=`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.pipelinePath}`;
  const hdr={Authorization:"Bearer "+token, Accept:"application/vnd.github+json"};
  setGStatus("Saving...","");
  try{
    // 1. Read current remote file (sha + content) to merge, avoiding clobbering teammates.
    let sha=null, remote={};
    const g=await fetch(`${api}?ref=${encodeURIComponent(branch)}`,{headers:hdr,cache:"no-store"});
    if(g.status===200){ const j=await g.json(); sha=j.sha; try{remote=JSON.parse(b64decode(j.content))||{};}catch(e){remote={};} }
    else if(g.status===401){ setGStatus("Token rejected (401). Reconnect GitHub.","err"); return; }
    else if(g.status!==404){ setGStatus("Read failed ("+g.status+").","err"); return; }
    // 2. Merge remote into local (newer lastTouched per opportunity wins), then persist merged locally.
    PIPELINE=mergePipeline(remote,PIPELINE);
    savePipelineLocal();
    // 3. Commit.
    const body={ message:"BD pipeline update "+today(), branch,
      content:b64encode(JSON.stringify(PIPELINE,null,2)) };
    if(sha)body.sha=sha;
    const p=await fetch(api,{method:"PUT",headers:hdr,body:JSON.stringify(body)});
    if(p.status===200||p.status===201){ setGStatus("Saved to GitHub "+today()+". Shared board updated.","ok"); renderPipeline(); }
    else if(p.status===409){ setGStatus("Conflict; someone saved first. Click Save again to merge.","err"); }
    else { const t=await p.text(); setGStatus("Save failed ("+p.status+"). "+t.slice(0,80),"err"); }
  }catch(e){ setGStatus("Save error: "+e.message,"err"); }
}

/* ------------------------------------------------------------ data load */
async function loadConfig(branch){
  const cands=["../"+CONFIG.configPath, rawURL(branch,CONFIG.configPath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); const p=j.profile||{}; const c=j.crawl||{};
    LANES=p.lanes||[]; AGENCY_TIERS=p.agency_tiers||{};
    WARM_PARTNERS=(p.warm_partners||c.warm_partners||[]).map(x=>x.toLowerCase());
    CORE_NAICS=new Set(c.naics_codes||[]); return true; }catch(e){} }
  return false;
}
async function loadSummaries(branch){
  const cands=["../"+CONFIG.summariesPath, rawURL(branch,CONFIG.summariesPath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); if(j && typeof j==="object"){ SUMMARIES=j; return true; } }catch(e){} }
  return false;
}
async function loadEnrichment(branch){
  const cands=["../"+CONFIG.enrichmentPath, rawURL(branch,CONFIG.enrichmentPath)];
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"}); if(!r.ok)continue;
    const j=await r.json(); if(j && typeof j==="object"){ ENRICHMENT=j; return true; } }catch(e){} }
  return false;
}
async function fetchLeads(branch){
  const cands=[]; for(const p of CONFIG.paths){ cands.push("../"+p); cands.push(rawURL(branch,p)); }
  let lastErr;
  for(const u of cands){ try{ const r=await fetch(u,{cache:"no-store"});
    if(!r.ok){lastErr=u+" -> HTTP "+r.status; continue;} const d=await r.json();
    if(Array.isArray(d)) return {data:d,url:u}; lastErr=u+" -> not an array"; }catch(e){lastErr=u+" -> "+e.message;} }
  throw new Error(lastErr||"no source reachable");
}
async function reload(){
  const branch=$("#branchInput").value.trim()||CONFIG.branch;
  localStorage.setItem(LS_BRANCH,branch);
  $("#srcInfo").textContent="Loading leads from "+branch+" ...";
  await loadConfig(branch);
  await loadSummaries(branch);
  await loadEnrichment(branch);
  await loadPipelineRemote(branch);
  updatePipeCount();
  try{
    const {data,url}=await fetchLeads(branch);
    const res=mergeLeads(data);
    const short=url.startsWith("..")?"repo (Pages)":"raw.githubusercontent.com";
    $("#srcInfo").innerHTML=`Loaded <b>${res.total}</b> from ${short} on <b>${esc(branch)}</b>. `+
      `Added ${res.added}, ${res.seen} already tracked. Working set: <b>${Object.keys(master).length}</b>. `+
      `Lanes loaded: ${LANES.length}.`;
    render(); renderPipeline();
  }catch(e){
    $("#srcInfo").innerHTML=`Could not auto-load (${esc(e.message)}). Use <b>Load JSON file</b> to import output/all_leads.json.`;
    render(); renderPipeline();
  }
}

function currentFilters(){return{
  q:$("#search").value.trim().toLowerCase(), source:$("#fSource").value, route:$("#fRoute").value,
  lane:$("#fLane").value, agency:$("#fAgency").value, sort:$("#fSort").value,
  showUnaligned:$("#fShowUnaligned").checked, setAside:$("#fSetAside").value,
  valMin:parseFloat($("#fValMin").value), valMax:parseFloat($("#fValMax").value),
  expiry:$("#fExpiry").value, heldVeh:$("#fHeldVeh").checked, exclude:$("#fExclude").value.trim().toLowerCase()
};}
function matches(l,f){
  if(l.source!=="Recent Award" && l.source!=="Expiring Contract") return false;   // RFI feed paused
  if(!f.showUnaligned && !aligned(l)) return false;
  if(f.source && l.source!==f.source) return false;
  if(f.route && route(l)!==f.route) return false;
  if(f.lane){ const m=laneMatch(l); if(!m||m.id!==f.lane) return false; }
  if(f.agency && l.agency!==f.agency) return false;
  if(f.heldVeh && !l.vehicleHeld) return false;
  if(f.setAside==="has" && !l.setAside) return false;
  if(f.setAside==="none" && l.setAside) return false;
  const v=Number(l.value)||0;
  if(!isNaN(f.valMin) && v<f.valMin*1e6) return false;
  if(!isNaN(f.valMax) && f.valMax>0 && v>f.valMax*1e6) return false;
  if(f.expiry){ const d=daysUntil(l.popEnd);
    if(f.expiry==="shaping"){ if(!isShaping(l)) return false; }
    else { if(l.source!=="Expiring Contract"||d===null||d<0||d>Number(f.expiry)) return false; } }
  if(f.q){ const hay=(l.title+" "+l.agency+" "+l.prime+" "+l.incumbent+" "+l.awardId+" "+l.notes).toLowerCase();
    if(!hay.includes(f.q)) return false; }
  if(f.exclude){ const terms=f.exclude.split(",").map(t=>t.trim()).filter(Boolean);
    const hay=(l.title+" "+l.agency+" "+l.prime+" "+l.incumbent+" "+l.notes).toLowerCase();
    if(terms.some(t=>hay.includes(t))) return false; }
  return true;
}
function sortLeads(arr,key){
  if(key==="value") return arr.sort((a,b)=>(Number(b.value)||0)-(Number(a.value)||0));
  if(key==="popEnd") return arr.sort((a,b)=>(daysUntil(a.popEnd)??1e9)-(daysUntil(b.popEnd)??1e9));
  if(key==="dateAdded") return arr.sort((a,b)=>String(b.dateAdded).localeCompare(String(a.dateAdded)));
  // default: warm first, then expiring-shaping, then value
  return arr.sort((a,b)=>{
    const w=(isWarm(b.prime||b.incumbent)?1:0)-(isWarm(a.prime||a.incumbent)?1:0); if(w)return w;
    const s=(isShaping(b)?1:0)-(isShaping(a)?1:0); if(s)return s;
    return (Number(b.value)||0)-(Number(a.value)||0);
  });
}

function renderTiles(){
  const all=Object.values(master).filter(l=>l.source==="Recent Award"||l.source==="Expiring Contract");
  const al=all.filter(aligned);
  const awards=al.filter(l=>l.source==="Recent Award").length;
  const exp=al.filter(l=>l.source==="Expiring Contract").length;
  const warm=al.filter(l=>route(l)==="Warm").length;
  const cold=al.filter(l=>route(l)==="Cold").length;
  const shaping=al.filter(isShaping).length;
  const held=al.filter(l=>l.vehicleHeld).length;
  const outlane=all.length-al.length;
  const t=[["",al.length,"Aligned leads"],["",awards,"Recent awards"],["",exp,"Expiring"],
    ["warm",warm,"Warm (route via channel)"],["cold",cold,"Cold outreach"],
    ["shape",shaping,"Shaping window"],["",held,"Held-vehicle"],["",outlane,"Out-of-lane (hidden)"]];
  const box=$("#tiles"); box.innerHTML="";
  for(const [cls,n,l] of t){const d=el("div","tile "+cls); d.appendChild(el("div","n",String(n))); d.appendChild(el("div","l",l)); box.appendChild(d);}
}
function refreshFilterOptions(){
  const all=Object.values(master);
  const agencies=[...new Set(all.map(l=>l.agency).filter(Boolean))].sort();
  const keepA=$("#fAgency").value, keepL=$("#fLane").value;
  $("#fAgency").innerHTML='<option value="">All agencies</option>'+agencies.map(s=>`<option>${esc(s)}</option>`).join("");
  $("#fLane").innerHTML='<option value="">All lanes</option>'+LANES.map(x=>`<option value="${esc(x.id)}">${esc(x.id)} - ${esc(x.title)}</option>`).join("");
  $("#fAgency").value=keepA; $("#fLane").value=keepL;
}
function render(){
  renderTiles(); refreshFilterOptions();
  const f=currentFilters();
  let arr=Object.values(master).filter(l=>matches(l,f));
  arr=sortLeads(arr,f.sort);
  const list=$("#list"); list.innerHTML="";
  const trackable=Object.values(master).filter(l=>l.source==="Recent Award"||l.source==="Expiring Contract").length;
  if(trackable===0){ list.appendChild(el("div","empty","No leads loaded yet. Use Reload from crawler or Load JSON file.")); }
  else if(arr.length===0){ list.appendChild(el("div","empty","No leads match the current filters.")); }
  else { const frag=document.createDocumentFragment(); for(const l of arr) frag.appendChild(leadCard(l)); list.appendChild(frag); }
  $("#count").textContent=arr.length+" shown";
}

function pursuitOwners(){ return [...new Set(Object.values(PIPELINE).map(p=>p.owner).filter(Boolean))].sort(); }
function daysSince(d){ if(!d)return null; const t=Date.parse(d); if(isNaN(t))return null; return Math.round((Date.now()-t)/86400000); }
function lastActivity(p){ const a=(p.activities||[]); return a.length?a[a.length-1]:null; }

function renderPipeTiles(){
  const ids=Object.keys(PIPELINE);
  const active=ids.filter(id=>!TERMINAL.has(PIPELINE[id].stage));
  const val=active.reduce((s,id)=>s+(Number((master[id]||{}).value)||0),0);
  const overdue=active.filter(id=>{const d=PIPELINE[id].nextActionDate; return d && daysUntil(d)<0;}).length;
  const shaping=ids.filter(id=>master[id]&&isShaping(master[id])&&!TERMINAL.has(PIPELINE[id].stage)).length;
  const won=ids.filter(id=>PIPELINE[id].stage==="Won").length;
  const t=[["",active.length,"Active pursuits"],["",fmtVal(val)||"$0","Pipeline value (active)"],
    ["shape",shaping,"Shaping window"],["cold",overdue,"Overdue next-action"],["warm",won,"Won"]];
  const box=$("#pTiles"); box.innerHTML="";
  for(const [cls,n,l] of t){const d=el("div","tile "+cls); d.appendChild(el("div","n",String(n))); d.appendChild(el("div","l",l)); box.appendChild(d);}
}
function pcard(id){
  const l=master[id]||{id,title:id}; const p=PIPELINE[id];
  const card=el("div","pcard"); card.dataset.id=id;
  card.appendChild(el("div","pt", l.title||id));
  const bits=[]; if(l.agency)bits.push(l.agency); if(l.value)bits.push(fmtVal(l.value));
  card.appendChild(el("div","pm", bits.join("  ·  ")));
  const row=el("div","prow");
  const r=route(l); row.appendChild(el("span","mini "+(r==="Warm"?"warm":"cold"), r));
  row.appendChild(el("span","mini", laneLabel(l)));
  if(p.owner)row.appendChild(el("span","mini", p.owner));
  if(p.nextActionDate){ const du=daysUntil(p.nextActionDate);
    row.appendChild(el("span","mini "+(du<0?"due":"ok"), (du<0?"overdue ":"due ")+p.nextActionDate)); }
  const ds=daysSince(p.stageSince); if(ds!=null && !TERMINAL.has(p.stage))row.appendChild(el("span","mini", ds+"d in stage"));
  card.appendChild(row);
  const la=lastActivity(p);
  if(la)card.appendChild(el("div","pm","Last: "+la.type+(la.note?" — "+la.note:"")+" ("+la.date+")"));
  // move controls
  const nav=el("div","nav");
  const i=STAGES.indexOf(p.stage);
  const back=el("button",null,"◀"); back.disabled=i<=0; back.title="Move back";
  back.addEventListener("click",e=>{e.stopPropagation(); if(i>0)setStage(id,STAGES[i-1]);});
  const fwd=el("button",null,"▶"); fwd.disabled=i>=STAGES.length-1||TERMINAL.has(p.stage); fwd.title="Advance";
  fwd.addEventListener("click",e=>{e.stopPropagation(); if(i<STAGES.length-1)setStage(id,STAGES[i+1]);});
  nav.appendChild(back); nav.appendChild(fwd);
  card.appendChild(nav);
  card.addEventListener("click",()=>openPursuit(id));
  return card;
}
function renderPipeline(){
  updatePipeCount();
  // stage + owner filters
  const sf=$("#pStageFilter"), of=$("#pOwnerFilter");
  if(sf){ const keep=sf.value; sf.innerHTML='<option value="">All stages</option>'+STAGES.map(s=>`<option>${esc(s)}</option>`).join(""); sf.value=keep; }
  if(of){ const keep=of.value; of.innerHTML='<option value="">All owners</option>'+pursuitOwners().map(o=>`<option>${esc(o)}</option>`).join(""); of.value=keep; }
  renderPipeTiles();
  const fOwner=of?of.value:"", fStage=sf?sf.value:"";
  const board=$("#board"); if(!board)return; board.innerHTML="";
  const ids=Object.keys(PIPELINE).filter(id=>(!fOwner||PIPELINE[id].owner===fOwner));
  if(ids.length===0){ board.appendChild(el("div","empty","No opportunities in the pipeline yet. On the Sourcing tab, click + Pursue on the ones you want to go after.")); board.style.display="block"; return; }
  board.style.display="flex";
  const cols=fStage?[fStage]:STAGES;
  for(const stage of cols){
    const col=el("div","col"+(TERMINAL.has(stage)?" terminal":""));
    const inCol=ids.filter(id=>PIPELINE[id].stage===stage);
    const sum=inCol.reduce((s,id)=>s+(Number((master[id]||{}).value)||0),0);
    const h=el("h3"); h.appendChild(el("span",null,stage));
    h.appendChild(el("span","csum", inCol.length+(sum?" · "+fmtVal(sum):"")));
    col.appendChild(h);
    inCol.sort((a,b)=>(Number((master[b]||{}).value)||0)-(Number((master[a]||{}).value)||0));
    for(const id of inCol) col.appendChild(pcard(id));
    board.appendChild(col);
  }
}

/* ------------------------------------------------------------ pursuit modal */
function closeModal(){ $("#modalRoot").innerHTML=""; }
function openPursuit(id){
  const l=master[id]||{id,title:id}; const p=PIPELINE[id]; if(!p)return;
  const root=$("#modalRoot"); root.innerHTML="";
  const overlay=el("div","modal"); overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
  const sheet=el("div","sheet");
  const mhead=el("div","mhead"); const hg=el("div");
  const oppUrl=l.url||((ENRICHMENT[id]||{}).hgPath)||"";
  if(oppUrl){const a=el("a",null,l.title||id); a.href=oppUrl; a.target="_blank"; a.rel="noopener"; a.style.cssText="font-weight:bold;font-size:15px;color:var(--navy)"; hg.appendChild(a);}
  else hg.appendChild(el("div",null,l.title||id));
  const sub=[]; if(l.agency)sub.push(l.agency); if(l.value)sub.push(fmtVal(l.value)); sub.push(l.source||"");
  hg.appendChild(el("div","hint", sub.filter(Boolean).join("  ·  ")));
  const x=el("button","x","×"); x.addEventListener("click",closeModal);
  mhead.appendChild(hg); mhead.appendChild(x); sheet.appendChild(mhead);

  const body=el("div","mbody");
  // editable fields
  const grid=el("div","grid");
  function fld(label,key,kind,opts){
    const f=el("div","fld"); f.appendChild(el("label",null,label)); let inp;
    if(kind==="select"){inp=el("select"); optionList(inp,opts,p[key]||"");}
    else if(kind==="textarea"){inp=el("textarea"); inp.value=p[key]||"";}
    else if(kind==="date"){inp=el("input"); inp.type="date"; inp.value=(p[key]||"").slice(0,10);}
    else {inp=el("input"); inp.type="text"; inp.value=p[key]||"";}
    inp.addEventListener("change",()=>{ if(key==="stage"){setStage(id,inp.value);} else {pipeEdit(id,key,inp.value);} });
    f.appendChild(inp); return f;
  }
  grid.appendChild(fld("Stage","stage","select",STAGES));
  grid.appendChild(fld("Owner","owner","text"));
  grid.appendChild(fld("Next action","nextAction","text"));
  grid.appendChild(fld("Next action date","nextActionDate","date"));
  const nt=fld("Notes","notes","textarea"); nt.style.gridColumn="1/-1"; grid.appendChild(nt);
  body.appendChild(grid);

  // contacts (from enrichment)
  const enr=ENRICHMENT[id]||{};
  if((enr.contacts||[]).length){
    const cd=el("div","contacts"); cd.style.marginTop="12px"; cd.appendChild(el("span","clabel","Contacts:"));
    (enr.contacts||[]).slice(0,4).forEach(c=>{ const span=el("span","contact"); const nm=c.name||c.email||"contact";
      if(c.email){const a=el("a",null,nm); a.href="mailto:"+c.email; span.appendChild(a);} else span.appendChild(document.createTextNode(nm));
      if(c.phone)span.appendChild(document.createTextNode(" · "+c.phone)); cd.appendChild(span); });
    body.appendChild(cd);
  }

  // activity timeline
  body.appendChild(el("h2",null,"Activity"));
  const tl=el("div","tl");
  const acts=(p.activities||[]).slice().reverse();
  if(!acts.length) tl.appendChild(el("div","hint","No activity logged yet."));
  for(const a of acts){ const ev=el("div","ev");
    ev.appendChild(el("span","ty",a.type)); if(a.note)ev.appendChild(document.createTextNode(" — "+a.note));
    ev.appendChild(el("div","d",a.date)); tl.appendChild(ev); }
  body.appendChild(tl);

  // add activity
  const add=el("div","addact");
  const tsel=el("select"); optionList(tsel,ACTIVITY_TYPES,"Call");
  const dinp=el("input"); dinp.type="date"; dinp.value=today();
  const ninp=el("input"); ninp.type="text"; ninp.placeholder="Note (optional)";
  const abtn=el("button",null,"Log activity");
  abtn.addEventListener("click",()=>{ addActivity(id,tsel.value,dinp.value,ninp.value.trim()); openPursuit(id); renderPipeline(); });
  add.appendChild(tsel); add.appendChild(dinp); add.appendChild(ninp); add.appendChild(abtn);
  body.appendChild(add);

  // footer: remove
  const foot=el("div"); foot.style.cssText="margin-top:16px;display:flex;justify-content:space-between;align-items:center";
  const meta=el("span","hint","Pursued "+(p.pursuedDate||"?")+" · in stage since "+(p.stageSince||"?"));
  const rm=el("button","warn","Remove from pipeline");
  rm.addEventListener("click",()=>{ togglePursue(id); closeModal(); });
  foot.appendChild(meta); foot.appendChild(rm); body.appendChild(foot);

  sheet.appendChild(body); overlay.appendChild(sheet); root.appendChild(overlay);
}

/* ------------------------------------------------------------ tabs */
function showTab(which){
  const src=which==="sourcing";
  $("#sourcingView").classList.toggle("hidden",!src);
  $("#pipelineView").classList.toggle("hidden",src);
  $("#tabSourcing").classList.toggle("active",src);
  $("#tabPipeline").classList.toggle("active",!src);
  if(!src) renderPipeline();
}

/* ------------------------------------------------------------ wire up */
function init(){
  loadMaster(); loadPipelineLocal();
  $("#branchInput").value=localStorage.getItem(LS_BRANCH)||CONFIG.branch;
  setDirty(false);
  $("#reloadBtn").addEventListener("click",reload);
  $("#exportBtn").addEventListener("click",exportJSON);
  $("#fileBtn").addEventListener("click",()=>$("#fileInput").click());
  $("#fileInput").addEventListener("change",ev=>{const file=ev.target.files[0]; if(!file)return;
    const rd=new FileReader(); rd.onload=()=>{try{const data=JSON.parse(rd.result);
      const res=mergeLeads(Array.isArray(data)?data:[data]);
      $("#srcInfo").innerHTML=`Imported <b>${res.total}</b> from file. Working set: <b>${Object.keys(master).length}</b>.`; render();
    }catch(e){alert("Could not parse JSON: "+e.message);}}; rd.readAsText(file); ev.target.value="";});
  $("#resetBtn").addEventListener("click",()=>{if(confirm("Clear all locally accumulated leads and edits? Export first if you want a backup.")){
    master={}; saveMaster(); setDirty(false); render(); $("#srcInfo").textContent="Local data cleared. Use Reload from crawler.";}});
  $("#clearFilters").addEventListener("click",()=>{
    ["#search","#fExclude","#fValMin","#fValMax"].forEach(s=>$(s).value="");
    ["#fSource","#fRoute","#fLane","#fAgency","#fSetAside","#fExpiry"].forEach(s=>$(s).value="");
    $("#fSort").value="default"; $("#fShowUnaligned").checked=false; $("#fHeldVeh").checked=false; render();});
  ["#search","#fSource","#fRoute","#fLane","#fAgency","#fSort","#fShowUnaligned",
   "#fSetAside","#fValMin","#fValMax","#fExpiry","#fHeldVeh","#fExclude"].forEach(sel=>{
    const e=$(sel); const ev=(e.tagName==="INPUT"&&(e.type==="text"||e.type==="number"))?"input":"change";
    e.addEventListener(ev,render);});
  // tabs + pipeline controls
  $("#tabSourcing").addEventListener("click",()=>showTab("sourcing"));
  $("#tabPipeline").addEventListener("click",()=>showTab("pipeline"));
  $("#pConnectBtn").addEventListener("click",connectGitHub);
  $("#pHelpBtn").addEventListener("click",showTokenHelp);
  $("#pSaveBtn").addEventListener("click",saveToGitHub);
  $("#pStageFilter").addEventListener("change",renderPipeline);
  $("#pOwnerFilter").addEventListener("change",renderPipeline);
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
  updatePipeCount();
  if(ghToken()) setGStatus("GitHub connected.","ok");
  window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault(); e.returnValue="";}});
  if(Object.keys(master).length>0){ render(); renderPipeline(); }
  reload();
}
document.addEventListener("DOMContentLoaded",init);
</script>
