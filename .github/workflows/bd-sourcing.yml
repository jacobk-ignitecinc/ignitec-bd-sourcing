name: Ignitec BD Sourcing

# Runs the sourcing crawler on a schedule and commits new leads back to the repo.
# You can also trigger it by hand from the Actions tab (Run workflow).

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC (about 7:00 AM ET). Edit to change cadence.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sourcing crawl
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python ignitec_bd_sourcing.py

      - name: Enrich with HigherGov (contacts, incumbent, vehicle)
        # Looks up each aligned award/expiring lead by Award ID and backfills
        # contracting-office contacts, incumbent identity, and vehicle into
        # output/enrichment.json. Incremental; skips if no key.
        env:
          HIGHERGOV_API_KEY: ${{ secrets.HIGHERGOV_API_KEY }}
        run: python bd_enrich.py

      - name: Generate AI summaries
        # Summarizes each aligned award/expiring lead via the Anthropic Batch API
        # (Haiku, profile-cached). Writes output/summaries.json. Skips if no key.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bd_summarize.py

      - name: Generate pre-vet report
        # Buckets the cumulative leads and writes output/report_latest.*
        # The Markdown is also appended to the run summary via GITHUB_STEP_SUMMARY.
        run: python bd_report.py

      - name: Commit new leads
        run: |
          git config user.name "bd-sourcing-bot"
          git config user.email "bd-sourcing-bot@users.noreply.github.com"
          git add output state.json docs
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "BD sourcing run $(date -u +%Y-%m-%d)"
            # Push resiliently: if the branch advanced while this run was working
            # (e.g. a concurrent commit), rebase onto it and retry rather than
            # discarding the freshly generated data.
            for i in 1 2 3 4 5; do
              if git push; then
                echo "Pushed."; break
              fi
              echo "Push rejected; rebasing on origin/${GITHUB_REF_NAME} and retrying ($i)..."
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || {
                echo "Rebase hit a conflict; aborting."; git rebase --abort || true; exit 1
              }
              sleep $((2 ** i))
            done
          fi
